<script>
'use strict';
const $=id=>document.getElementById(id);
const data=JSON.parse(new TextDecoder().decode(pako.inflate(Uint8Array.from(atob($('packed').textContent.trim()),c=>c.charCodeAt(0)))));
const {rows,visits,names,units,alts,counts}=data;
const num=n=>new Intl.NumberFormat('ru-RU').format(n);
const norm=s=>s.toLocaleUpperCase('ru').replaceAll('Ё','Е').replace(/\s+/g,' ').trim();
const date=d=>d==null?'—':new Date(Date.UTC(2026,10,1+d)).toLocaleDateString('ru-RU',{timeZone:'UTC'});
const code=v=>v?String(v[3]).padStart(6,'0'):'—';
const plural=(n,a,b,c)=>Math.abs(n)%100>=11&&Math.abs(n)%100<=14?c:Math.abs(n)%10===1?a:Math.abs(n)%10>=2&&Math.abs(n)%10<=4?b:c;
const days=n=>(n<0?'−'+Math.abs(n):n)+' '+plural(n,'день','дня','дней');
const difference=(r,v)=>r[2]-v[2];
const modeLabels={late:'Больше 14 дней',exact:'Ровно 14 дней',early:'0–13 дней',before:'Лаборатория раньше',multiple:'Несколько приёмов',check:'Сверить ФИО',missing:'Без совпадения',all:'Все записи'};
const matchKind={0:'В выгрузке ЖК за 1–19 ноября совпадение не найдено.',1:'Совпали ФИО и ИД ЕРЗЛ.',2:'Совпало ФИО. Идентификатор для сверки отсутствует.',3:'ФИО совпадает, идентификаторы расходятся. Связь требует проверки.',4:'ИД ЕРЗЛ совпадает, ФИО различается. Связь требует проверки.'};
const windowTests={late:n=>n>14,exact:n=>n===14,early:n=>n>=0&&n<14,before:n=>n<0};
const modeCounts={...counts,late:alts.any_late,exact:alts.any_exact,before:alts.any_before,multiple:alts.multiple,all:rows.length};
for(const k of ['early','before'])modeCounts[k]=rows.filter(r=>[1,2].includes(r[3])&&r[4].some(i=>windowTests[k](difference(r,visits[i])))).length;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
$('mark').src=$('icon').href;
$('intro').textContent=num(rows.length)+' лабораторные записи за 3–18 ноября сопоставлены с '+num(data.clinicCount)+' приёмами по кодам 001983 и 001984 за 1–19 ноября.';
$('lead').textContent=num(alts.any_late);
$('leadNote').textContent='У каждой из этих записей есть и более поздний приём ЖК. Ровно 14 дней от одного из приёмов прошло ещё у одной записи.';
const verified=rows.filter(r=>[1,2].includes(r[3]));
$('distNote').textContent='По одной ближайшей предшествующей или совпадающей дате для '+num(verified.length)+' записей с подтверждённым совпадением.';
for(const [label,lo,hi] of [['0–1 день',0,1],['2–4 дня',2,4],['5–13 дней',5,13],['14 и более',14,Infinity]]){
 const n=verified.filter(r=>r[6]>=lo&&r[6]<=hi).length;
 const t=el('span',undefined,'track'),bar=el('span',undefined,'bar');bar.style.width=(100*n/verified.length)+'%';t.append(bar);$('hist').append(el('span',label),t,el('b',num(n)));
}
let mode='late',page=0,open=new Set();const size=25;
const hints={late:'Показан приём ЖК, от которого прошло больше 14 календарных дней. Все остальные приёмы доступны в строке.',exact:'Разница между датами составляет ровно 14 календарных дней. Эта группа выделена отдельно.',early:'Есть приём ЖК в день лаборатории или за 1–13 дней до неё.',before:'Найдена дата ДОРЗ позже лаборатории. Отрицательный интервал показывает, на сколько дней лаборатория была раньше.',multiple:'Для одной лабораторной записи найдено несколько приёмов ЖК. Раскройте строку, чтобы увидеть даты и коды каждого.',check:'Идентификатор пациента совпадает, но ФИО в двух файлах отличается. Возможные приёмы видны в подробностях.',missing:'В файле ЖК за указанный период подходящего приёма не найдено. Более ранние приёмы могли остаться за пределами выгрузки.',all:'По умолчанию показан ближайший приём ЖК на дату лаборатории или до неё. Для каждой записи можно раскрыть все найденные приёмы.'};
for(const [k,label] of Object.entries(modeLabels)){
 const bt=el('button',label);bt.type='button';bt.dataset.mode=k;bt.append(el('b',num(modeCounts[k]||0)));bt.onclick=()=>{mode=k;resetPage()};$('quick').append(bt);
}
function resetPage(){page=0;open.clear();render()}
function relevant(r,chosenCode){
 let vs=r[4].map(i=>visits[i]);
 if(chosenCode)vs=vs.filter(v=>code(v)===chosenCode);
 if(windowTests[mode]){if(![1,2].includes(r[3]))return null;vs=vs.filter(v=>windowTests[mode](difference(r,v)));if(!vs.length)return null}
 if(mode==='multiple'&&(![1,2].includes(r[3])||r[4].length<2))return null;
 if(mode==='check'&&r[7]!=='check'||mode==='missing'&&r[7]!=='missing')return null;
 if(chosenCode&&(![1,2].includes(r[3])||!vs.length))return null;
 if(![1,2].includes(r[3]))return {r,v:null,d:null};
 const prior=vs.filter(v=>difference(r,v)>=0).sort((a,b)=>b[2]-a[2]||a[0]-b[0]);
 const v=prior[0]||vs[0];
 return {r,v,d:v?difference(r,v):null};
}
function describeDelta(n){return n>14?'Больше 14 дней':n===14?'Ровно 14 дней':n<0?'Лаборатория раньше':n===0?'В день приёма':'Меньше 14 дней'}
const collate=new Intl.Collator('ru');
function render(){
 const q=norm($('search').value),chosenCode=$('code').value;
 const list=rows.filter(r=>!q||norm(names[r[1]]).includes(q)).map(r=>relevant(r,chosenCode)).filter(Boolean);
 const order=$('sort').value;
 list.sort((a,b)=>(order==='row'?0:order==='date'?a.r[2]-b.r[2]:order==='name'?collate.compare(names[a.r[1]],names[b.r[1]]):(b.d??-Infinity)-(a.d??-Infinity))||a.r[0]-b.r[0]);
 const last=Math.max(0,Math.ceil(list.length/size)-1);page=Math.min(last,page);
 const items=list.slice(page*size,page*size+size);
 for(const bt of $('quick').children)bt.setAttribute('aria-pressed',String(bt.dataset.mode===mode));
 $('hint').textContent=hints[mode];$('pn').textContent='Отбор «'+modeLabels[mode]+'»'+(chosenCode?' · '+chosenCode:'')+(q?' · '+q:'');
 $('body').replaceChildren();
 for(const {r,v,d} of items){
   const tr=el('tr');let td=el('td');td.append(el('strong',names[r[1]]),el('small','Строка лаборатории '+r[0]));tr.append(td);
   tr.append(el('td',date(r[2]),'date'));td=el('td');td.append(el('span',v?date(v[2]):'—','date'));if(v)td.append(el('small',units[v[4]]));tr.append(td,el('td',code(v)),el('td',d===null?'—':days(d),'number'+(d>=14?' tone':'')));
   td=el('td',v?describeDelta(d):r[3]?'Проверить ФИО':'Приём не найден',d>=14?'tone':!v?'check':'');tr.append(td);
   td=el('td',undefined,'detailcol');const toggle=el('button',open.has(r[0])?'Свернуть':r[4].length?'Приёмы ('+r[4].length+')':'Подробнее','detailbutton');
   toggle.type='button';toggle.dataset.row=r[0];toggle.setAttribute('aria-expanded',String(open.has(r[0])));toggle.setAttribute('aria-label',toggle.textContent+' для строки '+r[0]);td.append(toggle);tr.append(td);$('body').append(tr);
   if(open.has(r[0])){
     const detail=el('tr',undefined,'detailrow'),box=el('td');box.colSpan=7;box.append(el('strong',matchKind[r[3]]));
     if(r[4].length){
       const ul=el('ul');for(const i of r[4]){const vv=visits[i],diff=difference(r,vv);const li=el('li');li.append(el('b',date(vv[2])+' · '+code(vv)),document.createTextNode(' · '+units[vv[4]]+' · строка ЖК '+vv[0]+' · '+(r[3]>=3?'предварительно ':'')+days(diff)+' · '+describeDelta(diff)));
       if(r[3]>=3)li.append(el('small','ФИО в ЖК: '+names[vv[1]]));ul.append(li)}box.append(ul)}
     detail.append(box);$('body').append(detail)
   }
 }
 if(!items.length){const tr=el('tr'),cell=el('td','Нет записей по выбранным условиям.','empty');cell.colSpan=7;tr.append(cell);$('body').append(tr)}
 $('prev').disabled=page===0;$('next').disabled=page>=last;$('page').textContent='Стр. '+(page+1)+' из '+(last+1);
 $('count').textContent=list.length?'Строки '+num(page*size+1)+'–'+num(page*size+items.length)+' из '+num(list.length):'Найдено 0 записей';
}
$('body').onclick=e=>{const bt=e.target.closest('button[data-row]');if(!bt)return;const rn=Number(bt.dataset.row);if(open.has(rn))open.delete(rn);else open.add(rn);render();$('body').querySelector('button[data-row="'+rn+'"]').focus({preventScroll:true})};
$('search').oninput=$('code').onchange=$('sort').onchange=resetPage;
$('reset').onclick=()=>{mode='all';$('search').value=$('code').value='';$('sort').value='desc';resetPage()};
$('prev').onclick=()=>{page--;open.clear();render()};$('next').onclick=()=>{page++;open.clear();render()};$('print').onclick=()=>window.print();
render();
</script></body></html>
